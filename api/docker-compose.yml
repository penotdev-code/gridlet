# Local Postgres for development (requires Docker).
# Then set DATABASE_URL=postgresql+asyncpg://gridlet:gridlet@localhost:5432/gridlet
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridlet
      POSTGRES_PASSWORD: gridlet
      POSTGRES_DB: gridlet
    ports:
      - "5432:5432"
    volumes:
      - gridlet_pgdata:/var/lib/postgresql/data

volumes:
  gridlet_pgdata:
